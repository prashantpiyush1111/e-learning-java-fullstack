spring.application.name=e-learning-backend

spring.datasource.url=jdbc:mysql://localhost:3306/elearning_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_database_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8083

# Use a random secret of at least 32 bytes in your environment.
app.jwt.secret=replace-with-a-random-strong-secret-at-least-32-bytes
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
